[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Latest Node 24 release; package.json requires at least 24.22.1 (security fixes)
  NODE_VERSION = "24"

# Optional: local dev hints for Netlify CLI (not required on Netlify); run `npm run build` first
[dev]
  publish = "dist"

# Headers, including the Content-Security-Policy, are written by the build to dist/_headers.

# Redirect HTTP to HTTPS to ensure secure context for browser APIs
[[redirects]]
  from = "http://*/*"
  to = "https://:splat"
  status = 301
  force = true
